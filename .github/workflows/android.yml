name: Build Sarookh Downloader APK
on:
workflow_dispatch:
permissions:
contents: read
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout project
  uses: actions/checkout@v4
- name: Set up Java
  uses: actions/setup-java@v4
  with:
      distribution: 'temurin'
      java-version: '17'
 - name: Set up Android SDK
   uses: android-actions/setup-android@v3
  - name: Install Gradle
    run: |
      wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle.zip
      unzip -q gradle.zip -d "$RUNNER_TEMP"
      echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
  - name: Install Android packages
    run: |
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
  - name: Build APK
    run: gradle assembleDebug
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Sarookh-Downloader-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
